<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Fission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#6C4CF1;
    --purple-dark:#5A38E8;
    --purple-light:#EFEAFE;
    --purple-line:#E4DEFB;
    --ink:#14141F;
    --ink-soft:#5B5B6B;
    --ink-faint:#8B8B9A;
    --bg:#FAFAFC;
    --card:#FFFFFF;
    --line:#E9E8F2;
    --green:#22C55E;
    --green-light:#E7F9EE;
    --red:#DC2626;
    --red-light:#FEF2F2;
    --amber:#F59E0B;
    --amber-light:#FEF6E7;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  input, select, textarea{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--purple); outline-offset:2px;}

  /* ---------- Gate / loading / denied screen ---------- */
  #gateScreen{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px;
    z-index:999;
    text-align:center;
    padding:24px;
  }
  .gate-spinner{
    width:34px; height:34px;
    border-radius:50%;
    border:3px solid var(--purple-line);
    border-top-color:var(--purple);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #gateScreen p{ font-size:13.5px; color:var(--ink-soft); margin:0; max-width:320px; }
  #gateScreen.hidden{ display:none; }
  #gateScreen .gate-icon{ font-size:30px; }
  #gateScreen .btn{ margin-top:6px; }

  #shell{ display:none; }
  #shell.ready{ display:block; }

  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(250,250,252,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .tb-left{ display:flex; align-items:center; gap:10px; }
  .tb-left .logo-mark{ display:flex; }
  .tb-left h1{ font-size:15px; font-weight:800; margin:0; }
  .tb-left .badge-role{
    font-size:10px; font-weight:800; letter-spacing:0.03em;
    color:var(--purple); background:var(--purple-light);
    padding:3px 8px; border-radius:999px; text-transform:uppercase;
  }
  .tb-right{ display:flex; align-items:center; gap:10px; }

  .acc-wrap{ position:relative; }
  .acc-btn{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:5px 12px 5px 5px;
    cursor:pointer;
  }
  .acc-avatar{
    width:26px; height:26px; border-radius:50%;
    background:linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; flex-shrink:0;
  }
  .acc-btn span{ font-size:12.5px; font-weight:700; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drop{
    position:absolute; top:44px; right:0;
    width:210px;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    box-shadow:0 16px 34px -14px rgba(20,20,31,0.28);
    padding:8px; display:none; z-index:50;
  }
  .drop.open{ display:block; }
  .acc-email{
    font-size:11.5px; color:var(--ink-faint);
    padding:6px 10px 10px; border-bottom:1px solid var(--line);
    margin-bottom:6px; word-break:break-all;
  }
  .acc-logout{
    width:100%; text-align:left; background:none; border:none;
    padding:9px 10px; border-radius:8px;
    font-weight:700; font-size:13px; color:var(--red); cursor:pointer;
  }
  .acc-logout:hover{ background:var(--red-light); }
  .ad-dashboard{
    display:block; width:100%; box-sizing:border-box; text-align:left;
    padding:8px; border-radius:8px; font-weight:700; font-size:13px;
    color:var(--ink); cursor:pointer; margin-bottom:2px;
  }
  .ad-dashboard:hover{ background:var(--purple-light); color:var(--purple); }

  .content{ padding:20px 18px 60px; max-width:760px; margin:0 auto; }

  .content-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .content-head h2{ font-size:17px; font-weight:800; margin:0; }
  .content-head p{ font-size:12px; color:var(--ink-faint); margin:3px 0 0; }

  .filter-tabs{
    display:flex; gap:6px;
    background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:4px;
  }
  .filter-tab{
    background:none; border:none; padding:8px 14px;
    border-radius:999px; font-weight:700; font-size:12.5px;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .filter-tab.active{ background:var(--purple); color:#fff; }
  .count-pill{
    font-size:10px; font-weight:800;
    background:rgba(255,255,255,0.25); border-radius:999px;
    padding:1px 7px;
  }
  .filter-tab:not(.active) .count-pill{ background:var(--purple-light); color:var(--purple); }

  .sub-list{ display:flex; flex-direction:column; gap:14px; }

  .sub-card{
    background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-md); padding:16px;
    position:relative;
  }
  .sub-card.is-new{ border-color:var(--purple-line); box-shadow:0 0 0 3px var(--purple-light); }

  .sub-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px; margin-bottom:10px;
  }
  .sub-plan{ font-size:14.5px; font-weight:800; }
  .sub-price{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .sub-date{ font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }

  .new-badge{
    font-size:9.5px; font-weight:800; letter-spacing:0.03em;
    background:var(--purple); color:#fff;
    padding:3px 8px; border-radius:999px;
    text-transform:uppercase; margin-right:6px;
  }
  .seen-badge{
    font-size:9.5px; font-weight:800; letter-spacing:0.03em;
    background:var(--green-light); color:#15803D;
    padding:3px 8px; border-radius:999px;
    text-transform:uppercase; margin-right:6px;
  }

  .sub-desc{
    font-size:13px; color:var(--ink-soft); line-height:1.55;
    background:var(--bg); border-radius:10px; padding:11px 12px;
    margin-bottom:12px;
    white-space:pre-wrap;
  }

  .sub-contact{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:14px;
  }
  .contact-chip{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; color:var(--ink);
    background:var(--bg); border:1px solid var(--line);
    border-radius:999px; padding:7px 12px;
  }
  .contact-chip svg{ width:13px; height:13px; color:var(--purple); flex-shrink:0; }
  .contact-chip:hover{ border-color:var(--purple); }

  .url-row{
    display:flex; gap:8px; margin-bottom:12px;
  }
  .url-row input{
    flex:1; min-width:0;
    font-size:13px; padding:10px 12px;
    border-radius:10px; border:1.5px solid var(--line);
    background:var(--bg); color:var(--ink);
  }
  .url-row input:focus{ outline:none; border-color:var(--purple); background:#fff; }
  .url-saved-note{ font-size:11px; color:var(--green); margin:-6px 0 12px; display:none; }
  .url-saved-note.show{ display:block; }

  .sub-actions{ display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:999px; padding:10px 16px;
    font-weight:700; font-size:13px; cursor:pointer; border:1.5px solid transparent;
  }
  .btn-primary{ background:var(--purple); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:#fff; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--purple); color:var(--purple); }
  .btn-sm{ padding:8px 14px; font-size:12.5px; }
  .btn[disabled]{ opacity:0.55; cursor:not-allowed; }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-faint); font-size:13px;
    background:#fff; border:1px dashed var(--line); border-radius:var(--radius-md);
  }
  .empty-state .big{ font-size:26px; margin-bottom:8px; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px);
    background:var(--ink); color:#fff;
    font-size:12.5px; font-weight:600;
    padding:11px 18px; border-radius:999px;
    opacity:0; pointer-events:none;
    transition:all 0.25s ease;
    z-index:200;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

  <!-- ---------- Gate screen ---------- -->
  <div id="gateScreen">
    <div class="gate-spinner" id="gateSpinner"></div>
    <p id="gateMsg">Checking your session…</p>
  </div>

  <!-- ---------- Admin shell ---------- -->
  <div id="shell">
    <header class="topbar">
      <div class="tb-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 2L5 13H11L9 22L19 10H12L14 2Z" fill="url(#g4)"/><defs><linearGradient id="g4" x1="5" y1="2" x2="19" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#7C5CFC"/><stop offset="1" stop-color="#5A38E8"/></linearGradient></defs></svg>
        <h1>Fission</h1>
        <span class="badge-role">Admin</span>
      </div>
      <div class="tb-right">
        <div class="acc-wrap">
          <button class="acc-btn" id="accBtn">
            <span class="acc-avatar" id="accAvatar">?</span>
            <span id="accLabel">Account</span>
          </button>
          <div class="drop" id="accDropdown">
            <div class="acc-email" id="accEmail"></div>
            <a href="dashboard.html" class="ad-dashboard">My Dashboard</a>
            <button class="acc-logout" id="logoutBtn">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="content-head">
        <div>
          <h2>Plan submissions</h2>
          <p>New sign-ups that finished the onboarding form.</p>
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="new">New <span class="count-pill" id="newCount">0</span></button>
          <button class="filter-tab" data-filter="all">All <span class="count-pill" id="allCount">0</span></button>
        </div>
      </div>

      <div class="sub-list" id="subList">
        <div class="empty-state">Loading submissions…</div>
      </div>

      <div class="content-head" style="margin-top:34px;">
        <div>
          <h2>Customer messages</h2>
          <p>Website change requests sent from customer dashboards.</p>
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" data-msg-filter="new">New <span class="count-pill" id="msgNewCount">0</span></button>
          <button class="filter-tab" data-msg-filter="all">All <span class="count-pill" id="msgAllCount">0</span></button>
        </div>
      </div>

      <div class="sub-list" id="msgList">
        <div class="empty-state">Loading messages…</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ---------- Supabase ----------
  var SUPABASE_URL = 'https://peuhprnoszejkwtczzmv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_BTPwUe4Cfe5UaTat8VP1Jw_YH5o4IMr';
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- Real visit tracking (visitors + page views) ----------
  (function(){
    try {
      var vId = localStorage.getItem('fission_vid');
      if (!vId) {
        vId = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
        localStorage.setItem('fission_vid', vId);
      }
      supabaseClient.from('site_visits').insert({
        visitor_id: vId,
        page: location.pathname.split('/').pop() || 'admin.html'
      });
    } catch(e) { /* localStorage unavailable — skip tracking silently */ }
  })();

  var gateScreen = document.getElementById('gateScreen');
  var gateSpinner = document.getElementById('gateSpinner');
  var gateMsg = document.getElementById('gateMsg');
  var shell = document.getElementById('shell');
  var currentSession = null;

  // ---------- Toast ----------
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function denyAccess(message){
    gateSpinner.style.display = 'none';
    gateScreen.innerHTML =
      '<div class="gate-icon">🔒</div>' +
      '<p style="font-weight:800; color:var(--ink); font-size:15px;">Admins only</p>' +
      '<p>' + escapeHtml(message) + '</p>' +
      '<a href="index.html" class="btn btn-primary btn-sm">Back to site</a>';
  }

  // ---------- Auth guard + admin check ----------
  // This page requires a signed-in Supabase session AND membership in
  // the `admins` table. Row Level Security enforces this on the data
  // itself too, so even if this client-side check were bypassed, a
  // non-admin querying plan_selections would still only get their own
  // row back — never anyone else's.
  function redirectToAuth(){
    gateMsg.textContent = 'Please sign in — redirecting…';
    setTimeout(function(){
      window.location.href = 'index.html?auth=1&redirect=admin';
    }, 700);
  }

  supabaseClient.auth.getSession().then(function(res){
    var session = res.data.session;
    if (!session) { redirectToAuth(); return; }
    currentSession = session;

    supabaseClient.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle()
      .then(function(adminRes){
        if (adminRes.error || !adminRes.data) {
          denyAccess("Your account (" + session.user.email + ") doesn't have admin access.");
          return;
        }
        applySession(session);
        gateScreen.classList.add('hidden');
        shell.classList.add('ready');
        initAdmin();
      });
  }).catch(function(){
    redirectToAuth();
  });

  supabaseClient.auth.onAuthStateChange(function(event){
    if (event === 'SIGNED_OUT') window.location.href = 'index.html';
  });

  function initialsFor(session){
    var name = (session.user.user_metadata && session.user.user_metadata.full_name) || '';
    var source = name || session.user.email || '?';
    return source.trim().charAt(0).toUpperCase();
  }

  function applySession(session){
    document.getElementById('accAvatar').textContent = initialsFor(session);
    document.getElementById('accLabel').textContent = session.user.email.split('@')[0];
    document.getElementById('accEmail').textContent = session.user.email;
  }

  // ---------- Admin content ----------
  function initAdmin(){
    var accBtn = document.getElementById('accBtn');
    var accDropdown = document.getElementById('accDropdown');
    accBtn.addEventListener('click', function(e){
      e.stopPropagation();
      accDropdown.classList.toggle('open');
    });
    document.addEventListener('click', function(){ accDropdown.classList.remove('open'); });
    document.getElementById('logoutBtn').addEventListener('click', function(){
      supabaseClient.auth.signOut();
    });

    var subList = document.getElementById('subList');
    var newCountEl = document.getElementById('newCount');
    var allCountEl = document.getElementById('allCount');
    var filterTabs = document.querySelectorAll('[data-filter]');
    var currentFilter = 'new';
    var submissions = [];

    filterTabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        filterTabs.forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    function formatDate(iso){
      try {
        return new Date(iso).toLocaleString('en-NG', { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' });
      } catch(e){ return iso; }
    }

    function waLink(number){
      var digits = (number || '').replace(/[^\d+]/g, '').replace(/^\+/, '');
      return 'https://wa.me/' + digits;
    }

    function loadSubmissions(){
      supabaseClient.from('plan_selections').select('*')
        .eq('details_submitted', true)
        .order('created_at', { ascending: false })
        .then(function(res){
          if (res.error) {
            subList.innerHTML = '<div class="empty-state">Could not load submissions.</div>';
            console.warn(res.error.message);
            return;
          }
          submissions = res.data;
          render();
        });
    }

    function render(){
      var newOnes = submissions.filter(function(s){ return !s.seen; });
      newCountEl.textContent = newOnes.length;
      allCountEl.textContent = submissions.length;

      var list = currentFilter === 'new' ? newOnes : submissions;
      subList.innerHTML = '';

      if (!list.length) {
        subList.innerHTML =
          '<div class="empty-state"><div class="big">📭</div>' +
          (currentFilter === 'new' ? "You're all caught up — no new submissions." : 'No submissions yet.') +
          '</div>';
        return;
      }

      list.forEach(function(row){
        var card = document.createElement('div');
        card.className = 'sub-card' + (row.seen ? '' : ' is-new');
        card.innerHTML =
          '<div class="sub-head">' +
            '<div>' +
              '<div class="sub-plan">' + (row.seen ? '<span class="seen-badge">Seen</span>' : '<span class="new-badge">New</span>') + escapeHtml(row.plan_name) + '</div>' +
              '<div class="sub-price">' + escapeHtml(row.price_label || '') + '</div>' +
            '</div>' +
            '<div class="sub-date">' + formatDate(row.created_at) + '</div>' +
          '</div>' +
          '<div class="sub-desc">' + escapeHtml(row.website_description || '—') + '</div>' +
          '<div class="sub-contact">' +
            '<a class="contact-chip" href="mailto:' + escapeHtml(row.contact_email) + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>' +
              escapeHtml(row.contact_email) +
            '</a>' +
            '<a class="contact-chip" href="' + waLink(row.whatsapp_number) + '" target="_blank" rel="noopener">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>' +
              escapeHtml(row.whatsapp_number) +
            '</a>' +
          '</div>' +
          '<div class="url-row">' +
            '<input type="url" placeholder="https://yourbrand.fission.site" value="' + escapeHtml(row.website_url || '') + '" data-url-input="' + row.id + '">' +
            '<button class="btn btn-ghost btn-sm" data-save-url="' + row.id + '">Save URL</button>' +
          '</div>' +
          '<p class="url-saved-note" id="urlNote-' + row.id + '">Website URL saved — the customer can now see it on their dashboard.</p>' +
          '<div class="sub-actions">' +
            (row.seen ? '' : '<button class="btn btn-primary btn-sm" data-mark-seen="' + row.id + '">Mark seen</button>') +
          '</div>';
        subList.appendChild(card);
      });

      subList.querySelectorAll('[data-mark-seen]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.dataset.markSeen;
          btn.disabled = true;
          supabaseClient.from('plan_selections').update({ seen: true }).eq('id', id).then(function(res){
            if (res.error) { btn.disabled = false; showToast('Could not update — please try again.'); return; }
            var row = submissions.find(function(s){ return s.id === id; });
            if (row) row.seen = true;
            showToast('Marked as seen.');
            render();
          });
        });
      });

      subList.querySelectorAll('[data-save-url]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.dataset.saveUrl;
          var input = subList.querySelector('[data-url-input="' + id + '"]');
          var url = input.value.trim();
          btn.disabled = true;
          supabaseClient.from('plan_selections').update({ website_url: url }).eq('id', id).then(function(res){
            btn.disabled = false;
            if (res.error) { showToast('Could not save the URL — please try again.'); return; }
            var row = submissions.find(function(s){ return s.id === id; });
            if (row) row.website_url = url;
            var note = document.getElementById('urlNote-' + id);
            if (note) {
              note.classList.add('show');
              setTimeout(function(){ note.classList.remove('show'); }, 3000);
            }
            showToast('Website URL saved for this customer.');
            if (url && row) {
              supabaseClient.from('notifications').insert({
                user_id: row.user_id,
                message: '🎉 Your website is now live!'
              });
            }
          });
        });
      });
    }

    loadSubmissions();

    // ---------- Customer messages ----------
    var msgList = document.getElementById('msgList');
    var msgNewCountEl = document.getElementById('msgNewCount');
    var msgAllCountEl = document.getElementById('msgAllCount');
    var msgFilterTabs = document.querySelectorAll('[data-msg-filter]');
    var msgCurrentFilter = 'new';
    var messages = [];

    msgFilterTabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        msgFilterTabs.forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        msgCurrentFilter = tab.dataset.msgFilter;
        renderMessages();
      });
    });

    function contactFor(userId){
      var match = submissions.find(function(s){ return s.user_id === userId; });
      return match ? { email: match.contact_email, whatsapp: match.whatsapp_number } : null;
    }

    function loadMessages(){
      supabaseClient.from('messages').select('*').order('created_at', { ascending: false })
        .then(function(res){
          if (res.error) {
            msgList.innerHTML = '<div class="empty-state">Could not load messages.</div>';
            console.warn(res.error.message);
            return;
          }
          messages = res.data;
          renderMessages();
        });
    }

    function renderMessages(){
      var newOnes = messages.filter(function(m){ return !m.seen; });
      msgNewCountEl.textContent = newOnes.length;
      msgAllCountEl.textContent = messages.length;

      var list = msgCurrentFilter === 'new' ? newOnes : messages;
      msgList.innerHTML = '';

      if (!list.length) {
        msgList.innerHTML =
          '<div class="empty-state"><div class="big">💬</div>' +
          (msgCurrentFilter === 'new' ? "You're all caught up — no new messages." : 'No messages yet.') +
          '</div>';
        return;
      }

      list.forEach(function(row){
        var contact = contactFor(row.user_id);
        var card = document.createElement('div');
        card.className = 'sub-card' + (row.seen ? '' : ' is-new');
        card.innerHTML =
          '<div class="sub-head">' +
            '<div>' +
              '<div class="sub-plan">' + (row.seen ? '<span class="seen-badge">Seen</span>' : '<span class="new-badge">New</span>') + escapeHtml(row.plan_name || 'Fission') + '</div>' +
            '</div>' +
            '<div class="sub-date">' + formatDate(row.created_at) + '</div>' +
          '</div>' +
          '<div class="sub-desc">' + escapeHtml(row.message) + '</div>' +
          (contact ? (
            '<div class="sub-contact">' +
              (contact.email ? '<a class="contact-chip" href="mailto:' + escapeHtml(contact.email) + '">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>' +
                escapeHtml(contact.email) + '</a>' : '') +
              (contact.whatsapp ? '<a class="contact-chip" href="' + waLink(contact.whatsapp) + '" target="_blank" rel="noopener">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>' +
                escapeHtml(contact.whatsapp) + '</a>' : '') +
            '</div>'
          ) : '<p class="sub" style="margin:0 0 12px; font-size:11.5px;">No contact info on file for this customer.</p>') +
          '<div class="sub-actions">' +
            (row.seen ? '' : '<button class="btn btn-primary btn-sm" data-mark-msg-seen="' + row.id + '">Mark seen &amp; notify customer</button>') +
          '</div>';
        msgList.appendChild(card);
      });

      msgList.querySelectorAll('[data-mark-msg-seen]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.dataset.markMsgSeen;
          var row = messages.find(function(m){ return m.id === id; });
          if (!row) return;
          btn.disabled = true;
          supabaseClient.from('messages').update({ seen: true }).eq('id', id).then(function(res){
            if (res.error) { btn.disabled = false; showToast('Could not update — please try again.'); return; }
            row.seen = true;
            renderMessages();
            showToast('Marked as seen — customer notified.');
            supabaseClient.from('notifications').insert({
              user_id: row.user_id,
              message: 'Fission has seen your request and is working on it.'
            });
          });
        });
      });
    }

    loadMessages();
  }
})();
</script>
</body>
</html>
